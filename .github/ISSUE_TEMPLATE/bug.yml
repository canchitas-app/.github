name: 🐛 Bug
description: Algo no funciona como debería
title: "fix: "
labels: ["type: bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué pasa
      description: Describí el problema en pocas palabras.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Loguearse como owner
        2. Ir a Reservas
        3. Elegir una cancha y un horario
        4. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Qué pasó en cambio
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Local (Mongo en Docker)
        - Local contra Atlas dev
        - Staging
        - Producción
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo / navegador
      placeholder: "Ej: Android 14 con Expo Go, Chrome 141"
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - "Bloqueante: no se puede usar la app o una función principal"
        - "Alta: funciona mal, pero hay una forma de evitarlo"
        - "Baja: detalle visual o menor"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Errores de consola, respuesta de la API, screenshots. **Revisá que no haya tokens ni contraseñas.**
      render: shell
